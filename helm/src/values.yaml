replicaCount: 1

image:
  repository: vladimirkhil/accountservice
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  hosts:
    - host: accountservice.local
      paths:
        - path: /
          pathType: Prefix

accountService:
  connectionString: "Host=postgres;Port=5432;Database=accountservice;Username=postgres;Password=postgres"
  adminClientSecret: "change-me"
  steamApiKey: "change-me"
  steamAppId: "0"
  steamIdentity: "account-service"
  jwtIssuer: "AccountService"
  jwtAudience: "AccountConsumers"
  jwtPrivateKeyPem: ""
  jwtPublicKeyPem: ""

postgres:
  host: postgres
  port: 5432
  database: accountservice
  username: postgres
  password: postgres
